name: machine-workshop
services:
  test-db:
    image: postgres:17-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: workshop_test
      POSTGRES_USER: workshop_test
      POSTGRES_PASSWORD: workshop-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop_test -d workshop_test"]
      interval: 2s
      timeout: 5s
      retries: 20
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: workshop
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: infra/php/Dockerfile
    working_dir: /workspace/apps/api
    volumes:
      - .:/workspace
      - api_vendor:/workspace/apps/api/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:3000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: workshop
      DB_USERNAME: workshop
      DB_PASSWORD: workshop-local-only
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/api/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: infra/node/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_INTERNAL_ORIGIN: http://api:8000
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - web_modules:/workspace/apps/web/node_modules
      - simulation_modules:/workspace/packages/simulation/node_modules
      - verifier_modules:/workspace/apps/verifier/node_modules
    command: pnpm dev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  api_vendor:
  node_modules:
  web_modules:
  simulation_modules:
  verifier_modules:
